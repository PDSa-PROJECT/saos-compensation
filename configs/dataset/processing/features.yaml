metadata_fields:
- judgment_year
- court_type # SAOS division.court.type; independent of procedural instance.
- instance
- prior_payment # Earlier principal paid in PLN, rounded to int; 0 without confirmation.
- injured_party_count # Explicit recipients; defaults to 1 when unavailable.
- court_locality_size # Population class of the court locality (GUGiK).

# The damage field must have accepted source evidence.
text_fields:
  cause: "Co spowodowało szkodę osób dochodzących świadczenia w tej sprawie?"
  damage: "Jakiej szkody doznały osoby dochodzące świadczenia w tej sprawie? Opisz ich własną szkodę, a nie szkodę innego uczestnika lub członka rodziny."
  limitations: "Jakie czynności były utrudnione lub niemożliwe dla osób dochodzących świadczenia w tej sprawie wskutek ich własnej szkody?"
